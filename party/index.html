<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>준혁 · 은수 뒷풀이</title>
<meta name="description" content="2026년 11월 14일 · 쌍용동 라퓨타">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCF9F5">
<meta property="og:title" content="준혁 · 은수 뒷풀이">
<meta property="og:description" content="질문 · 사진 · 축하 메시지 · 무대 신청">
<meta property="og:image" content="https://jkoonst.github.io/wedding/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
/* ═══════════════ 팔레트 — 청첩장과 같은 세계 ═══════════════ */
:root{
  --paper:#FCF9F5; --paper-2:#F4EADB; --card:#FFFFFF;
  --ink:#3A332C; --ink-2:#6B6154; --ink-3:#9C9182;
  --gold:#C9A16B; --gold-deep:#A87F45; --line:#E6DBC8;
  --rose:#DD6A32; --rose-soft:#EE9A63;
  --olive:#8B9A6B; --olive-deep:#67754A;
  --brick:#BE8158;
  --ok:#67754A; --bad:#B8472A;
  --f-sans:"Pretendard Variable",Pretendard,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-myeongjo:"Gowun Batang","Nanum Myeongjo",Batang,serif;
  --f-serif:"Cormorant Garamond",Georgia,serif;
  --f-script:"Parisienne","Segoe Script",cursive;
}
/* 큰 화면(TV)용 — 어두운 조명 아래에서 잘 보이는 따뜻한 밤색 */
body.tv{
  --paper:#1A1410; --paper-2:#251D17; --card:#2B221B;
  --ink:#F6EFE4; --ink-2:#D2C5B2; --ink-3:#9E8F7B;
  --gold:#D9B27A; --gold-deep:#E6C48F; --line:#3C3027;
  --rose:#EE8A5A; --ok:#A9BA86; --bad:#F08A6A;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; }
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-sans);
  line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh;
}
body.tv{ background:radial-gradient(ellipse at 50% -10%, #3A2A1E 0%, #1A1410 60%) fixed, #1A1410; overflow-x:hidden; }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:inherit; }
[hidden]{ display:none !important; }

/* ═══════════════ 휴대폰 공통 ═══════════════ */
.wrap{ max-width:480px; margin:0 auto; padding:0 16px 48px; }
.hero{ text-align:center; padding:48px 0 26px; }
.label{ display:block; font-family:var(--f-serif); font-size:12px; font-weight:500; letter-spacing:.42em; text-transform:uppercase; color:var(--gold); }
.names{ font-family:var(--f-myeongjo); font-weight:400; font-size:30px; letter-spacing:.12em; margin:10px 0 6px; }
.names i{ font-family:var(--f-script); font-style:normal; color:var(--gold-deep); font-size:28px; letter-spacing:0; margin:0 4px; }
.meta{ margin:0; font-size:13px; color:var(--ink-3); letter-spacing:.04em; }
.arch{ display:block; margin:18px auto 0; }

.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tile{
  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  padding:18px 16px 16px; border-radius:18px; text-decoration:none;
  background:var(--card); border:1px solid var(--line);
  box-shadow:0 10px 24px -18px rgba(90,64,34,.45);
  transition:transform .15s ease, box-shadow .15s ease; min-height:132px;
}
.tile:active{ transform:scale(.97); }
.tile .ic{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#fff; }
.tile b{ font-size:16px; font-weight:700; letter-spacing:-.01em; }
.tile span{ font-size:12.5px; color:var(--ink-3); line-height:1.4; margin-top:-6px; }
.ic svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.c1{ background:var(--rose); } .c2{ background:var(--olive-deep); } .c3{ background:var(--gold-deep); }
.c4{ background:var(--brick); } .c5{ background:#7C6A9A; } .c6{ background:#C4586C; } .c7{ background:#C08A1E; }
.c8{ background:#3F7F8C; }
.notice{ margin-top:16px; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--rose); border-radius:14px; padding:14px 16px 6px; }
.notice h3{ margin:0 0 6px; font-family:var(--f-myeongjo); font-weight:400; font-size:16px; letter-spacing:.06em; }
.notice ul{ margin:0; padding-left:18px; font-size:14px; color:var(--ink-2); }
.notice li{ margin-bottom:8px; } .notice b{ color:var(--ink); }
/* 행운 번호 */
.ticket{ position:fixed; left:12px; bottom:12px; z-index:45; display:flex; align-items:center; gap:6px; background:var(--ink); color:var(--paper); border:0; border-radius:99px; padding:8px 14px 8px 10px; font-size:13px; cursor:pointer; box-shadow:0 8px 20px -8px rgba(0,0,0,.5); }
.ticket b{ font-family:var(--f-serif); font-size:20px; color:#FFD89A; line-height:1; }
.tmodal{ position:fixed; inset:0; z-index:70; background:rgba(26,20,16,.6); display:flex; align-items:center; justify-content:center; padding:16px; animation:pop .3s ease both; }
.tcard{ width:100%; max-width:360px; background:var(--paper); border-radius:22px; padding:26px 22px 20px; text-align:center; box-shadow:0 20px 50px -20px rgba(0,0,0,.6); }
.tcard .label{ margin-bottom:6px; }
.tcard .no{ font-family:var(--f-serif); font-weight:600; font-size:96px; line-height:1; color:var(--rose); margin:6px 0; }
.tcard p{ margin:0 0 14px; font-size:14px; color:var(--ink-2); }
.tcard .row{ display:flex; gap:8px; margin-bottom:10px; } .tcard .row .inp{ flex:1; }
.tcard .row button{ flex:none; border:0; border-radius:12px; background:var(--ink); color:var(--paper); padding:0 16px; font-weight:700; cursor:pointer; }
.winner{ font-family:var(--f-myeongjo); font-size:clamp(24px,3vw,44px); color:var(--ink-2); min-height:1.4em; }
.mrow .acts a{ border:1px solid var(--gold); color:var(--gold); padding:6px 12px; border-radius:9px; font-size:13px; text-decoration:none; }
.tile.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; min-height:0; gap:14px; }
.tile.wide span{ margin:0 0 0 auto; text-align:right; }
.host-tag{ font-size:10.5px !important; color:var(--gold-deep) !important; letter-spacing:.06em; }

.timeline{ margin-top:22px; background:var(--paper-2); border-radius:16px; padding:4px 18px; }
.timeline summary{ cursor:pointer; padding:14px 0; font-family:var(--f-myeongjo); font-size:15px; letter-spacing:.08em; list-style:none; display:flex; justify-content:space-between; }
.timeline summary::after{ content:"펼치기"; font-family:var(--f-sans); font-size:12px; color:var(--ink-3); letter-spacing:0; }
.timeline[open] summary::after{ content:"접기"; }
.timeline ol{ list-style:none; margin:0 0 14px; padding:0; }
.timeline li{ display:flex; gap:14px; padding:7px 0; border-top:1px dashed var(--line); font-size:14px; }
.timeline li time{ font-family:var(--f-serif); font-size:16px; font-weight:600; color:var(--gold-deep); min-width:46px; }
.foot{ text-align:center; margin-top:28px; font-size:12px; color:var(--ink-3); }
.foot a{ color:var(--ink-3); }

.bar{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 0; background:var(--paper); }
.back{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; text-decoration:none; background:var(--paper-2); font-size:18px; flex:none; }
.bar h2{ margin:0; font-family:var(--f-myeongjo); font-weight:400; font-size:19px; letter-spacing:.06em; }
.lead{ color:var(--ink-2); font-size:14px; margin:6px 0 18px; }

.field{ display:block; margin-bottom:16px; }
.field > span{ display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
.inp{ width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:16px; outline:none; }
.inp:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,161,107,.18); }
textarea.inp{ min-height:120px; resize:vertical; line-height:1.55; }
.count{ text-align:right; font-size:12px; color:var(--ink-3); margin-top:4px; }
.seg{ display:flex; gap:8px; flex-wrap:wrap; }
.seg button{ flex:1; min-width:70px; padding:11px 8px; border-radius:12px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-weight:600; font-size:14px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn{ display:block; width:100%; padding:15px; border:0; border-radius:14px; background:var(--rose); color:#fff; font-weight:700; font-size:16px; cursor:pointer; text-align:center; text-decoration:none; }
.btn:disabled{ opacity:.55; }
.btn.ghost{ background:transparent; color:var(--ink-2); border:1px solid var(--line); font-weight:600; }
.btn + .btn{ margin-top:10px; }
.tvlink{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:22px; font-size:13px; color:var(--ink-3); text-decoration:none; }

.done{ text-align:center; padding:40px 8px; }
.done .big{ font-size:46px; }
.done h3{ font-family:var(--f-myeongjo); font-weight:400; font-size:21px; margin:10px 0 6px; }
.done p{ color:var(--ink-2); margin:0 0 22px; }

.drop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:30px 16px; border:1.5px dashed var(--gold); border-radius:16px; background:var(--card); cursor:pointer; text-align:center; color:var(--ink-2); }
.drop b{ color:var(--ink); font-size:16px; }
.uplist{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
.up{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--paper-2); }
.up img{ width:100%; height:100%; object-fit:cover; display:block; }
.up i{ position:absolute; inset:auto 0 0 0; padding:3px; font-style:normal; font-size:11px; text-align:center; color:#fff; background:rgba(0,0,0,.45); }
.up.ok i{ background:rgba(103,117,74,.85); } .up.err i{ background:rgba(184,71,42,.85); }

.demo{ position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:50; background:#3A332C; color:#FCF9F5; font-size:11.5px; padding:5px 12px; border-radius:99px; opacity:.85; pointer-events:none; white-space:nowrap; }
.toast{ position:fixed; left:50%; top:16px; transform:translate(-50%,-80px); z-index:60; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:99px; font-size:14px; transition:transform .25s ease; max-width:calc(100% - 32px); }
.toast.show{ transform:translate(-50%,0); }

/* ═══════════════ 큰 화면(TV) 공통 ═══════════════ */
.tvwrap{ min-height:100vh; padding:28px 40px 32px; display:flex; flex-direction:column; }
.tvhead{ display:flex; align-items:center; gap:22px; margin-bottom:22px; }
.tvhead .ttl{ flex:1; min-width:0; }
.tvhead h1{ margin:0; word-break:keep-all; font-family:var(--f-myeongjo); font-weight:400; font-size:clamp(26px,3.2vw,44px); letter-spacing:.06em; }
.tvhead p{ margin:2px 0 0; color:var(--ink-3); font-size:clamp(13px,1.2vw,17px); }
.qr{ display:flex; align-items:center; gap:12px; background:#FCF9F5; color:#3A332C; border-radius:14px; padding:8px 14px 8px 8px; flex:none; }
.qr .code{ width:84px; height:84px; }
.qr .code img,.qr .code canvas{ width:84px !important; height:84px !important; display:block; }
.qr small{ display:block; font-size:12px; color:#6B6154; }
.qr b{ font-size:15px; }
.tvtools{ position:fixed; right:14px; bottom:12px; display:flex; gap:8px; opacity:.25; transition:opacity .2s; z-index:20; }
.tvtools:hover{ opacity:1; }
.tvtools a,.tvtools button{ background:var(--card); border:1px solid var(--line); color:var(--ink-2); border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; text-decoration:none; }
.tabs{ display:flex; gap:8px; margin-bottom:18px; }
.tabs button{ background:transparent; border:1px solid var(--line); color:var(--ink-2); border-radius:99px; padding:7px 16px; cursor:pointer; font-size:15px; }
.tabs button[aria-pressed="true"]{ background:var(--gold); color:#1A1410; border-color:var(--gold); font-weight:700; }
.empty{ margin:auto; text-align:center; color:var(--ink-3); font-size:clamp(18px,2vw,26px); }
.empty b{ display:block; font-family:var(--f-myeongjo); font-weight:400; color:var(--ink-2); font-size:clamp(24px,3vw,40px); margin-bottom:8px; }
@keyframes pop{ from{ opacity:0; transform:translateY(14px) scale(.96); } to{ opacity:1; transform:none; } }
.new{ animation:pop .5s cubic-bezier(.2,.8,.2,1.2) both; }

/* 질문함 */
.qgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; align-content:start; }
.qcard{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px; transition:transform .15s; }
.qcard:hover{ transform:translateY(-2px); border-color:var(--gold); }
.qcard p{ margin:0; font-size:clamp(17px,1.5vw,21px); line-height:1.5; word-break:keep-all; overflow-wrap:anywhere; }
.qcard footer{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-3); }
.qcard.is-done{ opacity:.45; }
.chip{ display:inline-block; align-self:flex-start; font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:99px; background:rgba(217,178,122,.16); color:var(--gold-deep); }
.chip.신랑{ background:rgba(124,150,190,.18); color:#9DB5DA; } .chip.신부{ background:rgba(238,138,90,.18); color:var(--rose); }
.spot{ position:fixed; inset:0; z-index:30; background:rgba(12,9,7,.88); display:flex; align-items:center; justify-content:center; padding:5vw; animation:pop .3s ease both; }
.spot article{ max-width:1100px; width:100%; text-align:center; }
.spot .chip{ font-size:clamp(16px,1.6vw,22px); padding:6px 18px; align-self:center; }
.spot p{ font-family:var(--f-myeongjo); font-size:clamp(30px,4.6vw,68px); line-height:1.4; margin:26px 0 18px; word-break:keep-all; overflow-wrap:anywhere; color:#FCF4E6; }
.spot .who{ color:var(--ink-3); font-size:clamp(16px,1.6vw,22px); }
.spot .acts{ display:flex; gap:12px; justify-content:center; margin-top:40px; flex-wrap:wrap; }
.spot .acts button{ border:1px solid var(--line); background:var(--card); color:var(--ink); padding:12px 22px; border-radius:12px; font-size:16px; cursor:pointer; }
.spot .acts .pri{ background:var(--gold); color:#1A1410; border-color:var(--gold); font-weight:700; }

/* 사진 월 */
.stage{ position:fixed; inset:0; background:#0E0B09; overflow:hidden; }
.stage .bgblur{ position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(40px) brightness(.45); transition:background-image .8s; }
.stage img.slide{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity 1s ease; }
.stage img.slide.on{ opacity:1; }
.stage .cap{ position:absolute; left:32px; bottom:28px; right:40%; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.7); }
.stage .cap b{ display:block; font-family:var(--f-myeongjo); font-weight:400; font-size:clamp(20px,2.4vw,34px); }
.stage .cap span{ font-size:clamp(14px,1.3vw,18px); opacity:.85; }
.stage .qr{ position:absolute; right:24px; bottom:24px; }
.stage .badge{ position:absolute; left:32px; top:26px; background:var(--rose); color:#fff; border-radius:99px; padding:6px 16px; font-weight:700; font-size:clamp(14px,1.3vw,18px); animation:pop .4s ease both; }
.stage .cnt{ position:absolute; right:28px; top:24px; color:rgba(255,255,255,.6); font-size:15px; }
.pgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
.pgrid figure{ margin:0; position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--card); }
.pgrid img{ width:100%; height:100%; object-fit:cover; display:block; }
.pgrid figure.is-hidden{ opacity:.25; }
.pgrid button{ position:absolute; right:6px; top:6px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:8px; padding:4px 9px; font-size:12px; cursor:pointer; }

/* 메시지 월 */
.feature{ text-align:center; padding:10px 0 30px; min-height:160px; }
.feature p{ font-family:var(--f-myeongjo); font-size:clamp(28px,3.6vw,54px); line-height:1.35; margin:0 auto 10px; max-width:1100px; word-break:keep-all; overflow-wrap:anywhere; animation:pop .6s ease both; }
.feature span{ color:var(--gold-deep); font-size:clamp(16px,1.5vw,22px); }
.wall{ flex:1; overflow:hidden; position:relative; -webkit-mask-image:linear-gradient(transparent,#000 6%,#000 90%,transparent); mask-image:linear-gradient(transparent,#000 6%,#000 90%,transparent); }
.wall-in{ columns:4 260px; column-gap:16px; padding:12px 0; }
.mcard{ break-inside:avoid; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:0 0 16px; }
.mcard p{ margin:0 0 6px; font-size:clamp(16px,1.35vw,19px); line-height:1.5; word-break:keep-all; overflow-wrap:anywhere; }
.mcard span{ font-size:13px; color:var(--gold-deep); }
.mcard:nth-child(3n+2){ background:#33271F; } .mcard:nth-child(5n+3){ border-color:rgba(238,138,90,.4); }

/* 무대 신청 */
.now{ background:linear-gradient(135deg,#4A3325,#2B221B); border:1px solid var(--gold); border-radius:22px; padding:24px 30px; margin-bottom:22px; display:flex; align-items:center; gap:24px; }
.now .lbl{ font-family:var(--f-serif); letter-spacing:.3em; color:var(--gold); font-size:15px; text-transform:uppercase; }
.now h3{ margin:4px 0 0; font-family:var(--f-myeongjo); font-weight:400; font-size:clamp(28px,3.4vw,50px); }
.now p{ margin:4px 0 0; color:var(--ink-2); font-size:clamp(16px,1.5vw,22px); }
.mlist{ display:flex; flex-direction:column; gap:10px; }
.mrow{ display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 18px; }
.mrow .no{ font-family:var(--f-serif); font-size:30px; font-weight:600; color:var(--gold); text-align:center; }
.mrow b{ font-size:clamp(18px,1.6vw,23px); } .mrow .k{ margin-left:8px; }
.mrow small{ display:block; color:var(--ink-3); font-size:14px; }
.mrow.is-done{ opacity:.4; }
.mrow .acts{ display:flex; gap:6px; }
.mrow .acts button{ background:transparent; border:1px solid var(--line); color:var(--ink-2); padding:6px 12px; border-radius:9px; cursor:pointer; font-size:13px; }

/* 경품 추첨 */
.draw{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; }
.slot{ font-family:var(--f-serif); font-weight:600; font-size:clamp(110px,min(26vw,36vh),360px); line-height:1; color:var(--gold); font-variant-numeric:tabular-nums; text-shadow:0 0 60px rgba(217,178,122,.35); min-height:1em; }
.slot.rolling{ color:var(--ink-2); }
.slot.hit{ animation:hit .7s cubic-bezier(.2,.8,.2,1.4) both; color:#FFD89A; }
@keyframes hit{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.12); } 100%{ transform:scale(1); } }
.drawbtn{ background:var(--rose); color:#fff; border:0; border-radius:99px; padding:18px 64px; font-size:clamp(20px,2vw,28px); font-weight:800; cursor:pointer; letter-spacing:.08em; box-shadow:0 10px 30px -10px rgba(238,138,90,.7); }
.drawbtn:disabled{ opacity:.5; }
.drawset{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; color:var(--ink-2); font-size:15px; }
.drawset input[type=number]{ width:80px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); text-align:center; }
.drawset button{ background:transparent; border:1px solid var(--line); color:var(--ink-2); padding:8px 14px; border-radius:10px; cursor:pointer; }
.hist{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:900px; }
.hist span{ background:var(--card); border:1px solid var(--line); border-radius:99px; padding:4px 14px; font-family:var(--f-serif); font-size:20px; font-weight:600; color:var(--gold-deep); }

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════ 설정 ═══════════════
   구글 Apps Script 웹 앱 주소(…/exec)를 넣으면 실제 모드로 동작한다.
   비워 두면 이 브라우저 안에서만 저장되는 데모 모드. */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyY2galFmWlDEmpeLFNhzeX7zgA8gqLUqQ7jbgWlTaYuIFkiE7sdUYeRn-NLWDc-SXf/exec';
const DEMO = !ENDPOINT || new URLSearchParams(location.search).has('demo');
const BASE = location.origin + location.pathname;

/* ═══════════════ 작은 도구들 ═══════════════ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = {
  get(k){ try { return localStorage.getItem('party_' + k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem('party_' + k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem('party_' + k); } catch(e){} },
};
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}
function ago(ts){
  const s = Math.max(0, (Date.now() - Number(ts)) / 1000);
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전';
  return Math.floor(s / 3600) + '시간 전';
}
function qr(el, url){
  const draw = () => {
    if (!window.QRCode) return setTimeout(draw, 300);
    el.innerHTML = '';
    new QRCode(el, { text: url, width: 240, height: 240, colorDark: '#3A332C', colorLight: '#FCF9F5', correctLevel: QRCode.CorrectLevel.M });
  };
  draw();
}
function qrBox(route, label){
  return `<div class="qr"><div class="code" data-qr="${esc(BASE + route)}"></div><div><small>QR 찍고</small><b>${esc(label)}</b></div></div>`;
}
function mountQr(){ $$('[data-qr]').forEach(el => qr(el, el.dataset.qr)); }

/* 페이지를 옮길 때 돌던 타이머를 모두 멈춘다 */
let cleanups = [];
function onLeave(fn){ cleanups.push(fn); }
function loop(fn, ms){
  let alive = true, t;
  const run = async () => { if (!alive) return; try { await fn(); } catch(e){ console.warn(e); } if (alive) t = setTimeout(run, ms); };
  run(); onLeave(() => { alive = false; clearTimeout(t); });
}

/* ═══════════════ 서버 통신 ═══════════════ */
async function apiGet(a, q = {}){
  if (DEMO) return demo.get(a, q);
  const u = new URL(ENDPOINT); u.searchParams.set('a', a);
  Object.entries(q).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set('_', Date.now());
  const j = await (await fetch(u)).json();
  if (!j.ok) throw new Error(j.error || '오류가 났어요');
  return j;
}
async function apiPost(body){
  if (DEMO) return demo.post(body);
  const r = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '오류가 났어요');
  return j;
}
const listRows = async t => (await apiGet('list', { t })).rows.sort((a, b) => a.ts - b.ts);

async function hostPin(){
  let p = store.get('pin');
  if (p) return p;
  p = prompt('진행자 PIN을 입력해 주세요');
  if (!p) throw new Error('취소');
  try { await apiPost({ a:'checkPin', pin:p }); }
  catch(e){ toast('PIN이 틀렸어요'); throw e; }
  store.set('pin', p); return p;
}
async function hostPost(body){
  const pin = await hostPin();
  try { return await apiPost({ ...body, pin }); }
  catch(e){ if (/PIN/.test(e.message)) store.del('pin'); toast(e.message); throw e; }
}

/* 이 기기를 구분하는 값 (입장 번호 · 레이스용) */
function deviceId(){
  let d = store.get('dev');
  if (!d){ d = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); store.set('dev', d); }
  return d;
}
const defaultTeams = n => Array.from({ length:n }, (_, i) => `${i + 1}팀`);
/* 레이스 집계 (데모 서버용 — 실제 서버는 Code.gs 에서 같은 계산) */
function raceSummary(st, entries){
  const n = st.teams.length, totals = Array(n).fill(0), players = Array(n).fill(0);
  entries.forEach(e => { if (e.t >= 0 && e.t < n){ totals[e.t] += Number(e.n) || 0; players[e.t]++; } });
  const out = { ...st, totals, players, now:Date.now() };
  if (st.status === 'go'){ const m = Math.max(0, ...totals); if (m >= st.goal){ out.status = 'done'; out.winner = totals.indexOf(m); out.changed = true; } }
  return out;
}

/* 데모 모드: 같은 브라우저의 탭끼리만 공유되는 가짜 서버 */
const demo = {
  PIN: '1114',
  rows(t){ try { return JSON.parse(localStorage.getItem('party_demo_' + t)) || []; } catch(e){ return []; } },
  save(t, v){ try { localStorage.setItem('party_demo_' + t, JSON.stringify(v)); } catch(e){ throw new Error('데모 저장 공간이 가득 찼어요'); } },
  tp(){ return this.rows('tp').round != null ? this.rows('tp') : { round:0, q:'', options:[], groom:null, bride:null, revealed:false, score:0, played:0 }; },
  pub(s){ return { round:s.round, q:s.q, options:s.options, revealed:s.revealed, score:s.score, played:s.played,
    groomDone:s.groom != null, brideDone:s.bride != null, groom:s.revealed ? s.groom : null, bride:s.revealed ? s.bride : null }; },
  race(){ const s = this.rows('race'); return s.round != null ? s : { round:0, status:'ready', goal:300, teams:defaultTeams(10), startAt:0, winner:null }; },
  racePub(){
    const s = this.race(); let taps = {}; try { taps = JSON.parse(localStorage.getItem('party_demo_racetaps')) || {}; } catch(e){}
    const out = raceSummary(s, Object.entries(taps).filter(([k]) => k.startsWith(s.round + '|')).map(([, v]) => v));
    if (out.changed){ delete out.changed; this.save('race', { ...s, status:out.status, winner:out.winner }); }
    return out;
  },
  async get(a, q){
    await sleep(120);
    if (a === 'list') return { ok:true, rows:this.rows(q.t).map(({ device, ...r }) => r) };
    if (a === 'tp') return { ok:true, tp:this.pub(this.tp()) };
    if (a === 'race') return { ok:true, race:this.racePub() };
  },
  async post(b){
    await sleep(b.a === 'raceTap' ? 60 : 250);
    const needPin = ['status','tpSet','tpReveal','tpReset','checkPin','raceSetup','raceStart','raceStop','raceReset'];
    if (needPin.includes(b.a) && b.pin !== this.PIN) throw new Error('진행자 PIN 이 틀렸어요');
    const row = { id: Math.random().toString(36).slice(2, 10), ts: Date.now(), status:'new' };
    if (b.a === 'ticket'){
      const all = this.rows('tickets'); let r = all.find(x => x.device === b.device);
      if (!r){
        const used = new Set(all.map(x => x.no)), free = [];
        for (let n = 1; n <= 100; n++) if (!used.has(n)) free.push(n);
        if (!free.length) throw new Error('번호가 모두 나갔어요');
        r = { ...row, no:free[Math.floor(Math.random() * free.length)], device:b.device, name:'' }; all.push(r);
      }
      if (b.name) r.name = String(b.name).slice(0, 20);
      this.save('tickets', all); const { device, ...pub } = r; return { ok:true, row:pub };
    }
    if (b.a && b.a.startsWith('race')){
      const s = this.race();
      let taps = {}; try { taps = JSON.parse(localStorage.getItem('party_demo_racetaps')) || {}; } catch(e){}
      if (b.a === 'raceTap' && s.status === 'go' && b.round === s.round && Date.now() >= s.startAt) taps[s.round + '|' + b.device] = { t:b.t, n:b.n };
      if (b.a === 'raceSetup'){ s.teams = b.teams; s.goal = b.goal; }
      if (b.a === 'raceStart'){ Object.assign(s, { round:s.round + 1, status:'go', startAt:Date.now() + 4000, winner:null }); taps = {}; }
      if (b.a === 'raceStop'){ s.status = 'done'; }
      if (b.a === 'raceReset'){ Object.assign(s, { round:s.round + 1, status:'ready', winner:null }); taps = {}; }
      localStorage.setItem('party_demo_racetaps', JSON.stringify(taps)); this.save('race', s);
      return { ok:true, race:this.racePub() };
    }
    if (b.a === 'add'){
      Object.assign(row, b.data);
      if (!row.name && b.t !== 'mic') row.name = '익명';
      const all = this.rows(b.t); all.push(row); this.save(b.t, all); return { ok:true, row };
    }
    if (b.a === 'photo'){
      Object.assign(row, { name:b.name || '익명', caption:b.caption || '', url:'data:image/jpeg;base64,' + b.data });
      const all = this.rows('photos'); all.push(row); this.save('photos', all); return { ok:true, row };
    }
    if (b.a === 'status'){
      const all = this.rows(b.t); const r = all.find(x => x.id === b.id); if (r) r.status = b.status; this.save(b.t, all); return { ok:true };
    }
    if (b.a === 'checkPin') return { ok:true };
    const s = this.tp();
    if (b.a === 'tpSet'){ Object.assign(s, { round:s.round + 1, q:b.q, options:b.options, groom:null, bride:null, revealed:false }); }
    if (b.a === 'tpAnswer' && !s.revealed && b.round === s.round){ s[b.who] = b.answer; }
    if (b.a === 'tpReveal' && !s.revealed && s.round > 0){ s.revealed = true; s.played++; if (s.groom != null && s.groom === s.bride) s.score++; }
    if (b.a === 'tpReset'){ Object.assign(s, { round:0, q:'', options:[], groom:null, bride:null, revealed:false, score:0, played:0 }); }
    this.save('tp', s); return { ok:true, tp:this.pub(s) };
  },
};

async function shrink(file, max, q){
  let img;
  try { img = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); }); }
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

  mountQr();
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  $('#grid').onclick = () => { location.hash = '#/photo/manage'; };
  let rows = [], seen = null, queue = [], idx = -1, layer = 0, current = null;
  const visible = () => rows.filter(r => r.status !== 'hidden');
  async function show(r, fresh){
    if (!r) return;
    const img = $('#s' + (1 - layer));
    await new Promise(ok => { img.onload = ok; img.onerror = () => { if (img.src !== photoFallback(r)) img.src = photoFallback(r); else ok(); }; img.src = photoSrc(r); });
    $('#s' + layer).classList.remove('on'); img.classList.add('on'); layer = 1 - layer; current = r;
    $('#bg').style.backgroundImage = `url("${img.src}")`;
    $('#cap').innerHTML = (r.caption ? `<b>${esc(r.caption)}</b>` : '') + `<span>${esc(r.name)} · ${ago(r.ts)}</span>`;
    $('#badge').innerHTML = fresh ? '<div class="badge">방금 올라온 사진</div>' : '';
  }
  function next(){
    const vis = visible(); if (!vis.length) return;
    if (queue.length) return show(queue.shift(), true);
    if (vis.length === 1 && current?.id === vis[0].id) return;
    idx = (vis.findIndex(r => r.id === current?.id) + 1) % vis.length;
    show(vis[idx], false);
  }
  loop(async () => {
    rows = await listRows('photos');
    const vis = visible();
    $('#empty').hidden = vis.length > 0;
    $('#cnt').textContent = vis.length ? `사진 ${vis.length}장` : '';
    if (seen) vis.filter(r => !seen.has(r.id)).forEach(r => queue.push(r));
    seen = new Set(rows.map(r => r.id));
    if (!current && vis.length) next();
    if (current && !vis.some(r => r.id === current.id)) next();
  }, 5000);
  const t = setInterval(next, 6500); onLeave(() => clearInterval(t));
}

    <section class="feature" id="feat"></section>
    <div class="wall" id="wall"><div class="wall-in" id="in"></div></div>
  </div>`);
  let rows = [], seen = null, sig = '', fi = 0, pinned = null;
  function feature(r){ $('#feat').innerHTML = r ? `<p>“${esc(r.text)}”</p><span>— ${esc(r.name)}</span>` : `<div class="empty"><b>첫 축하를 기다려요</b>QR을 찍고 한 줄 남겨 주세요</div>`; }
  function rotate(){
    const vis = rows.filter(r => r.status !== 'hidden'); if (!vis.length) return feature(null);
    if (pinned){ feature(pinned); pinned = null; return; }
    fi = (fi + 1) % vis.length; feature(vis[vis.length - 1 - fi]);
  }
  loop(async () => {
    rows = await listRows('messages');
    const vis = rows.filter(r => r.status !== 'hidden');
    $('#sub').textContent = vis.length ? `${vis.length}개의 축하가 도착했어요` : '';
    const s = JSON.stringify(vis.map(r => r.id)); if (s === sig) return; sig = s;
    const fresh = seen ? vis.filter(r => !seen.has(r.id)) : [];
    $('#in').innerHTML = vis.slice().reverse().map(r => `<div class="mcard ${seen && !seen.has(r.id) ? 'new' : ''}"><p>${esc(r.text)}</p><span>${esc(r.name)}</span></div>`).join('');
    if (!seen || fresh.length){ pinned = fresh.at(-1) || vis.at(-1) || null; fi = 0; rotate(); }
    seen = new Set(vis.map(r => r.id));
  }, 4000);
  const t1 = setInterval(rotate, 8000);
  // 벽이 넘치면 천천히 아래로 흘려 보내고 끝에서 처음으로
  const wall = $('#wall'); let hold = 0;
  const t2 = setInterval(() => {
    if (wall.scrollHeight <= wall.clientHeight + 4) return;
    if (hold > 0){ hold--; return; }
    wall.scrollTop += 1;
    if (wall.scrollTop + wall.clientHeight >= wall.scrollHeight - 2){ hold = 80; setTimeout(() => wall.scrollTo({ top:0, behavior:'smooth' }), 2500); }
  }, 45);
  onLeave(() => { clearInterval(t1); clearInterval(t2); });
}

/* ═══════════════ 5. 경품 추첨 ═══════════════
   기본은 QR로 실제 나간 행운 번호 중에서만 추첨 (서버에 당첨 기록).
   '번호 범위'로 바꾸면 서버 없이 이 화면에서만 추첨. */
function draw(){
  tv(`<div class="tvwrap">
    <header class="tvhead"><div class="ttl"><h1>행운의 번호</h1><p>입장할 때 받은 행운 번호를 확인하세요</p></div>${qrBox('#/', '번호 받기')}</header>
    <div class="draw">
      <div class="slot" id="slot">?</div>
      <div class="winner" id="who"></div>
      <button class="drawbtn" type="button" id="go">추첨!</button>
      <div class="hist" id="hist"></div>
      <div class="drawset noprint">
        <label><input type="radio" name="src" value="ticket" ${store.get('drawSrc') !== 'range' ? 'checked' : ''}> 입장 번호 (<span id="cnt">0</span>명)</label>
        <label><input type="radio" name="src" value="range" ${store.get('drawSrc') === 'range' ? 'checked' : ''}> 번호 범위</label>
        <span id="rangebox"><input type="number" id="lo" min="1" value="${esc(store.get('lo') || 1)}"> ~ <input type="number" id="hi" min="1" value="${esc(store.get('hi') || 100)}"></span>
        <button type="button" id="reset">기록 지우기</button>
      </div>
    </div>
  </div>`);
  let tickets = [];
  let hist = []; try { hist = JSON.parse(store.get('drawn') || '[]'); } catch(e){}
  const src = () => $('input[name=src]:checked').value;
  function paint(){
    $('#rangebox').hidden = src() !== 'range';
    $('#cnt').textContent = tickets.length;
    if (src() === 'ticket'){
      const won = tickets.filter(r => r.status === 'won');
      $('#hist').innerHTML = won.map(r => `<span>${esc(r.no)}${r.name ? ' ' + esc(r.name) : ''}</span>`).join('');
    } else {
      $('#hist').innerHTML = hist.map((n, i) => `<span title="${i + 1}번째">${n}</span>`).join('');
    }
  }
  $$('input[name=src]').forEach(r => r.onchange = () => { store.set('drawSrc', src()); paint(); });
  $('#lo').onchange = () => store.set('lo', $('#lo').value);
  $('#hi').onchange = () => store.set('hi', $('#hi').value);
  $('#reset').onclick = async () => {
    if (!confirm('추첨 기록을 지울까요? 당첨된 번호가 다시 추첨 대상이 돼요.')) return;
    if (src() === 'ticket'){
      for (const r of tickets.filter(r => r.status === 'won')){ await hostPost({ a:'status', t:'tickets', id:r.id, status:'new' }); r.status = 'new'; }
    } else { hist = []; store.set('drawn', '[]'); }
    $('#slot').textContent = '?'; $('#who').textContent = ''; paint();
  };
  loop(async () => { tickets = (await listRows('tickets')).filter(r => r.status !== 'hidden'); paint(); }, 5000);
  let busy = false;
  async function roll(nums, final){
    const slot = $('#slot'); slot.className = 'slot rolling'; $('#who').textContent = '';
    let d = 40;
    while (d < 420){ slot.textContent = nums[Math.floor(Math.random() * nums.length)]; await sleep(d); d *= 1.09; }
    slot.textContent = final; slot.className = 'slot hit'; confetti();
  }
  async function go(){
    if (busy) return;
    const rand = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
    if (src() === 'ticket'){
      const pool = tickets.filter(r => r.status !== 'won');
      if (!pool.length) return toast(tickets.length ? '남은 번호가 없어요' : '아직 번호를 받은 사람이 없어요');
      try { await hostPin(); } catch(e){ return; }
      busy = true; $('#go').disabled = true;
      const pick = pool[rand(pool.length)];
      try { await hostPost({ a:'status', t:'tickets', id:pick.id, status:'won' }); pick.status = 'won'; }
      catch(e){ busy = false; $('#go').disabled = false; return; }
      await roll(pool.map(r => r.no), pick.no);
      $('#who').textContent = pick.name ? `${pick.name} 님 축하드려요!` : '번호 주인은 앞으로 나와 주세요!';
      paint();
    } else {
      const lo = Math.floor(+$('#lo').value), hi = Math.floor(+$('#hi').value);
      if (!(hi >= lo)) return toast('번호 범위를 확인해 주세요');
      const pool = []; for (let n = lo; n <= hi; n++) if (!hist.includes(n)) pool.push(n);
      if (!pool.length) return toast('남은 번호가 없어요');
      busy = true; $('#go').disabled = true;
      const pick = pool[rand(pool.length)];
      await roll(pool, pick);
      hist.push(pick); store.set('drawn', JSON.stringify(hist)); paint();
    }
    busy = false; $('#go').disabled = false;
  }
  $('#go').onclick = go;
  const key = e => { if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); go(); } };
  document.addEventListener('keydown', key); onLeave(() => document.removeEventListener('keydown', key));
}
function confetti(){
  const colors = ['#D9B27A', '#EE8A5A', '#A9BA86', '#FCF4E6', '#C4586C'];
  for (let i = 0; i < 120; i++){
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    c.style.setProperty('--r', (Math.random() * 900) + 'deg');
    c.style.animationDuration = (2.4 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}

/* ═══════════════ 8. 팀 대항 연타 레이스 ═══════════════
   각 폰은 '이번 판에서 내가 누른 총 횟수'를 1초마다 보낸다(누적값이라 몇 번 실패해도 다음에 따라잡음).
   서버가 팀별로 더해서 큰 화면에 보여준다. */
const raceOffset = s => (s.now || Date.now()) - Date.now();      // 서버 시계 - 내 시계
function raceRanks(s){
  const order = s.totals.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
  const rank = Array(s.totals.length); order.forEach(([, i], k) => rank[i] = k + 1); return rank;
}

function race(){
  phone('웨딩로드 레이스', `<div id="rc"><p class="wait">불러오는 중…</p></div>`);
  const dev = deviceId();
  let s = null, offset = 0, mode = '', round = null, taps = 0, sent = -1, busy = false;
  let my = store.get('raceTeam'); my = my == null ? -1 : Number(my);
  const now = () => Date.now() + offset;
  const goTime = () => s && s.status === 'go' && now() >= s.startAt;

  function view(m){
    if (m === mode) return; mode = m;
    const rc = $('#rc');
    if (m === 'pick'){
      rc.innerHTML = `<p class="lead">우리 팀의 축하 편지 💌를 신랑신부에게 가장 먼저 배달하는 레이스예요. 팀을 고르고, 시작하면 화면을 마구 연타하세요!</p>
        <div class="teamgrid">${s.teams.map((t, i) => `<button type="button" data-i="${i}" aria-pressed="${i === my}">${esc(t)}</button>`).join('')}</div>
        <p class="wait" id="rmsg"></p>
        <p class="foot"><a href="#/race/screen">큰 화면</a> · <a href="#/race/host">진행자</a></p>`;
      $$('.teamgrid button').forEach(b => b.onclick = () => { my = Number(b.dataset.i); store.set('raceTeam', my); mode = ''; tick(); });
    } else if (m === 'pad'){
      rc.innerHTML = `<div class="pad" id="pad"><div class="padteam">💌 ${esc(s.teams[my] || '')}</div><div class="padnum" id="cd"></div><div class="padhint" id="ph">연타해서 축하 배달!</div>
        <div class="padroad"><div class="padbar"><i id="pb"></i></div><span class="padcouple">🤵👰</span></div><div class="padpct" id="pp"></div><div class="padme" id="pm"></div></div>`;
      const pad = $('#pad');
      pad.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (!goTime()) return;
        taps++; pad.classList.remove('hit'); void pad.offsetWidth; pad.classList.add('hit');
        $('#pm').textContent = `내가 보낸 축하 ${taps}번`;
        const h = document.createElement('span'); h.className = 'heart'; h.textContent = Math.random() < .25 ? '💌' : '♥';
        h.style.left = e.clientX + 'px'; h.style.top = (e.clientY - 64) + 'px'; h.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
        pad.appendChild(h); setTimeout(() => h.remove(), 900);
      });
      pad.addEventListener('contextmenu', e => e.preventDefault());
    } else if (m === 'done'){
      const rank = raceRanks(s);
      rc.innerHTML = `<div class="done"><div class="big">${s.winner === my ? '💐' : '💌'}</div>
        <h3>${s.winner != null ? esc(s.teams[s.winner]) + '의 축하가 1등으로 도착!' : '레이스 종료'}</h3>
        <p>${my >= 0 ? `우리 팀(${esc(s.teams[my])})은 ${rank[my]}등 · 내가 보낸 축하 ${taps}번` : ''}</p>
        <button class="btn ghost" type="button" id="re">팀 다시 고르기</button></div>`;
      $('#re').onclick = () => { my = -1; store.del('raceTeam'); mode = ''; tick(); };
    }
  }
  function tick(){
    if (!s) return;
    if (s.round !== round){ round = s.round; taps = 0; sent = -1; }
    if (s.status === 'done') return view('done');
    if (my < 0 || my >= s.teams.length || s.status === 'ready'){
      view('pick');
      const m = $('#rmsg'); if (m) m.textContent = my >= 0 ? `${s.teams[my]} 선택 완료! 진행자가 시작하면 화면이 바뀌어요.` : '';
      $$('.teamgrid button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.i) === my));
      return;
    }
    view('pad');
    const left = Math.ceil((s.startAt - now()) / 1000);
    $('#cd').textContent = left > 0 ? left : '';
    $('#ph').textContent = left > 0 ? '편지 준비…' : '연타해서 축하 배달!';
    const pct = Math.min(100, Math.round((s.totals[my] || 0) / s.goal * 100));
    $('#pb').style.width = pct + '%'; $('#pp').textContent = `신랑신부까지 ${pct}% 왔어요`;
  }
  async function sync(){
    if (busy) return; busy = true;
    try {
      const send = my >= 0 && goTime() && taps !== sent, n = taps;
      const j = send ? await apiPost({ a:'raceTap', device:dev, round:s.round, t:my, n }) : await apiGet('race');
      if (send) sent = n;
      s = j.race; offset = raceOffset(s); tick();
    } finally { busy = false; }
  }
  loop(sync, 1000);
  const t = setInterval(tick, 200); onLeave(() => clearInterval(t));
}

function raceScreen(){
  tv(`<div class="tvwrap">
    <header class="tvhead"><div class="ttl"><h1>웨딩로드 레이스</h1><p id="sub"></p></div>${qrBox('#/race', '레이스 참가')}</header>
    <div class="road">
      <div class="lanes" id="lanes"></div>
      <div class="altar"><div class="arch"></div><span class="ah">♥</span><div class="pair"><img src="../char-groom.png" alt="신랑"><img src="../char-bride.png" alt="신부"></div><b>준혁 &amp; 은수</b><small>2026. 11. 14</small></div>
    </div>
    <div class="cdown" id="cdown" hidden></div>
  </div>`);
  let s = null, offset = 0, sig = '', cheered = null, cheerAt = 0;
  function build(){
    $('#lanes').style.setProperty('--n', s.teams.length + 1);
    const marks = ['와인 모임', '고백', '대천 여행', '프러포즈', '11.14 결혼'];
    $('#lanes').innerHTML = `<div class="lane ruler"><div></div><div class="marks">${marks.map((m, k) => `<span style="left:${k * 23}%">${m}</span>`).join('')}</div><div></div></div>`
      + s.teams.map((t, i) => `<div class="lane" data-i="${i}">
      <div class="lname"><b>${esc(t)}</b><small></small></div>
      <div class="track"><div class="runner"><span class="rk"></span>💌</div><div class="flag">♥</div></div>
      <div class="lnum">0</div></div>`).join('');
  }
  function paint(){
    const sg = JSON.stringify([s.teams, s.round]); if (sg !== sig){ sig = sg; build(); }
    const rank = raceRanks(s);
    $('#sub').textContent = s.status === 'ready' ? `우리 팀의 축하를 신랑신부에게 가장 먼저! · 목표 ${s.goal}번 · QR 찍고 팀을 고르세요` : s.status === 'go' ? `축하 배달 중! · 목표 ${s.goal}번` : '축하 배달 완료';
    $$('.lane[data-i]').forEach(el => {
      const i = Number(el.dataset.i), v = s.totals[i] || 0;
      $('.runner', el).style.left = `calc(${Math.min(1, v / s.goal) * 100}% * .92)`;
      $('.lnum', el).textContent = v;
      $('.lname small', el).textContent = `${s.players[i] || 0}명`;
      $('.rk', el).textContent = v > 0 && rank[i] <= 3 ? rank[i] : '';
      el.classList.toggle('lead', v > 0 && rank[i] === 1);
      el.classList.toggle('win', s.winner === i);
    });
    const cd = $('#cdown'), left = Math.ceil((s.startAt - (Date.now() + offset)) / 1000);
    cd.classList.remove('win');
    if (s.status === 'go' && left > 0){ cd.hidden = false; cd.textContent = left; }
    else if (s.status === 'go' && left > -1){ cd.hidden = false; cd.textContent = '출발!'; }
    else if (s.status === 'done' && s.winner != null && (cheered !== s.round || Date.now() - cheerAt < 6000)){
      if (cheered !== s.round){ cheered = s.round; cheerAt = Date.now(); confetti(); }
      cd.hidden = false; cd.classList.add('win'); cd.innerHTML = `<small>축하 배달 1등</small>${esc(s.teams[s.winner])}<em>신랑신부에게 가장 먼저 도착했어요 ♥</em>`;
    } else cd.hidden = true;
  }
  loop(async () => { s = (await apiGet('race')).race; offset = raceOffset(s); paint(); }, 700);
  const t = setInterval(() => s && paint(), 250); onLeave(() => clearInterval(t));
}

/* ═══════════════ 행운 번호 (휴대폰으로 처음 들어오면 자동 발급) ═══════════════ */
let ticketBusy = false;
function ticketChip(){
  const no = store.get('ticket'); let chip = $('.ticket');
  if (!no || document.body.classList.contains('tv')){ chip?.remove(); return; }
  if (!chip){ chip = document.createElement('button'); chip.type = 'button'; chip.className = 'ticket'; document.body.appendChild(chip); chip.onclick = () => ticketModal(false); }
  chip.innerHTML = `행운 번호 <b>${esc(no)}</b>`;
}
function ticketModal(first){
  $('.tmodal')?.remove();
  const el = document.createElement('div'); el.className = 'tmodal';
  el.innerHTML = `<div class="tcard"><span class="label">Lucky Number</span>
    <p style="margin:0">${first ? '와 주셔서 고마워요! 당신의 행운 번호는' : '나의 행운 번호'}</p>
    <div class="no">${esc(store.get('ticket'))}</div>
    <p>마지막 경품 추첨에 이 번호로 응모돼요.<br>화면 왼쪽 아래에서 언제든 다시 볼 수 있어요.</p>
    <div class="row"><input class="inp" id="tname" maxlength="20" placeholder="이름 (선택) · 당첨 시 화면에 표시" value="${esc(store.get('ticketName') || '')}"><button type="button" id="tsave">저장</button></div>
    <button class="btn ghost" type="button" id="tclose">확인</button></div>`;
  document.body.appendChild(el);
  $('#tclose', el).onclick = () => el.remove();
  el.onclick = e => { if (e.target === el) el.remove(); };
  $('#tsave', el).onclick = async () => {
    const name = $('#tname', el).value.trim(); if (!name) return;
    try { await apiPost({ a:'ticket', device:deviceId(), name }); store.set('ticketName', name); toast('이름을 등록했어요'); el.remove(); }
    catch(e){ toast(e.message); }
  };
}
async function ensureTicket(){
  if (store.get('ticket')) return ticketChip();
  if (ticketBusy || !matchMedia('(pointer:coarse)').matches) return;   // 휴대폰에서만 자동 발급
  ticketBusy = true;
  try {
    const r = (await apiPost({ a:'ticket', device:deviceId() })).row;
    store.set('ticket', r.no); ticketChip();
    if (!document.body.classList.contains('tv')) ticketModal(true);
  } catch(e){ console.warn(e); } finally { ticketBusy = false; }
}

/* ═══════════════ 인쇄용 QR 안내판 ═══════════════ */
function poster(){
  document.body.className = '';
  app.innerHTML = `<div class="wrap poster">
    <span class="label">After Party</span>
    <h1 class="names">준혁<i>&amp;</i>은수</h1>
    <p class="meta">QR을 찍으면 행운 번호가 바로 나와요 · 마지막 경품 추첨에 응모돼요</p>
    <div class="code" data-qr="${esc(BASE)}"></div>
    <p class="meta">${esc(BASE.replace(/^https?:\/\//, ''))}</p>
    <div style="text-align:left;margin-top:18px">${FOOD_NOTICE}</div>
    <p class="noprint" style="margin-top:28px"><button class="btn" type="button" onclick="print()">인쇄하기</button><a class="btn ghost" href="#/">처음으로</a></p>
  </div>`;
  mountQr();
}

/* ═══════════════ 라우터 ═══════════════ */
const ROUTES = {
  '': home, 'ask': ask, 'ask/board': askBoard,
  'photo': photo, 'photo/board': photoBoard, 'photo/manage': photoManage,
  'msg': msg, 'msg/board': msgBoard, 'mic': mic, 'mic/board': micBoard,
  'draw': draw, 'tp': tpRoles, 'tp/screen': tpScreen, 'tp/host': tpHost,
  'tp/groom': () => tpPlayer('groom'), 'tp/bride': () => tpPlayer('bride'),
  'beer': beer, 'beer/board': beerBoard,
  'race': race, 'race/screen': raceScreen, 'race/host': raceHost,
  'qr': poster,
};
function route(){
  cleanups.forEach(f => f()); cleanups = [];
  $$('.spot').forEach(el => el.remove());
  const r = location.hash.replace(/^#\/?/, '').replace(/\/$/, '');
  $('.tmodal')?.remove();
  (ROUTES[r] || home)();
  window.scrollTo(0, 0);
  if (r !== 'qr') ensureTicket(); else $('.ticket')?.remove();
  if (DEMO && !$('.demo')) document.body.insertAdjacentHTML('beforeend', '<div class="demo">데모 모드 · 이 기기에서만 저장돼요 · 진행자 PIN 1114</div>');
}
addEventListener('hashchange', route);
route();
</script>
